name: tempo
description: "Tempo: Una herramienta de bienestar digital enfocada en la gestión
  de la intención y reducción de la distracción en Android."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_device_apps: ^0.8.1
  flutter_overlay_window: ^0.5.0
  flutter_riverpod: ^2.6.1
  go_router: ^17.3.0
  usage_stats: ^1.3.1
  intl: ^0.20.3
  flutter_background_service: ^5.1.0
  flutter_local_notifications: ^22.3.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
