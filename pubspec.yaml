name: tempo
description: "Tempo: Una herramienta de bienestar digital enfocada en la gestión
  de la intención y reducción de la distracción en Android."
publish_to: "none"
version: 0.1.0+3

environment:
  sdk: ^3.11.4

dependencies:
  android_intent_plus: ^6.1.0
  flutter:
    sdk: flutter
  flutter_background_service: ^5.1.0
  flutter_device_apps: ^0.8.1
  flutter_local_notifications: ^22.3.0
  flutter_riverpod: ^2.6.1
  go_router: ^17.3.0
  in_app_purchase: ^3.3.1
  intl: ^0.20.3
  permission_handler: ^12.0.1
  shared_preferences: ^2.5.5
  usage_stats: ^1.3.1

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.7
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  # Configuración de assets del proyecto
  assets:
    - assets/images/
